<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Strokes</title>
    <!-- The theme (light or dark) before anything is drawn: the player's choice, else the device's (see src/theme.ts). -->
    <script>
      (function () {
        var choice = 'system';
        try {
          choice = localStorage.getItem('strokes:theme') || 'system';
        } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
