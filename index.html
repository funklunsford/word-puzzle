<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The tab icon (public/favicon.svg, drawn by scripts/favicon.ts); the ?v= makes browsers fetch it again when it changes. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=tiles" />
    <!-- The title and description are what search results show, so they say what the game is. The
         title is also the tab's name; on an iPhone's home screen the game is still just "Strokes". -->
    <title>Strokes: a daily word ladder puzzle</title>
    <meta name="apple-mobile-web-app-title" content="Strokes" />
    <meta name="description" content="A daily word ladder puzzle: turn the start word into the goal word, stroke by stroke, in as few strokes as you can. Free to play in your browser." />
    <!-- The link preview when a result is shared (public/og.png, drawn by drawPreviewCard in src/share.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Strokes" />
    <meta property="og:title" content="Strokes: a daily word puzzle" />
    <meta property="og:description" content="Turn one word into another, stroke by stroke. A new puzzle every day." />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og.png?v=golf" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Strokes, written in coloured strokes, over the tray of strokes the game is played with" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- One look, always dark (Chalk & Charcoal): the browser's own parts match it. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#18171d" />
    <!-- The stroke colours and motion before anything is drawn (public/boot.js). -->
    <script src="./boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
