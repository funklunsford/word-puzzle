# Every push to main (a merged pull request) is tested, built and published to https://strokes.fun,
# the Cloudflare Pages project "strokes" (scripts/deploy-cloudflare.sh, with the CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID secrets). A pull request from this repo is tested, built and published as
# a preview, at <branch>.strokes-f1a.pages.dev, never to strokes.fun. Dependabot's get no secrets, so
# they're only tested and built.
#
# The nightly run pushes its day files straight to main, so a push is only published if every
# commit Claude pushed since the last publish just adds day files (scripts/check-nightly.sh). If
# one did more, look, then publish by hand: Actions > Test and deploy > Run workflow.
#
# Actions are pinned to a commit (the version in the comment), so a moved tag can't change what runs.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push replaces a run still in progress on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # to find the last publish (scripts/check-nightly.sh)

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the nightly check reads every commit since the last publish
      - name: Nightly commits only add days
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/check-nightly.sh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
      - name: Publish to Cloudflare Pages
        # The live site from main, a preview from a pull request. Pull requests from forks get no secrets.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-cloudflare.sh
