# Every push to main (a merged pull request) is tested, built and published to the site,
# https://funklunsford.github.io/strokes/ (GitHub Pages on the funklunsford/strokes repo), and to
# Cloudflare Pages, which will serve https://strokes.fun (scripts/deploy-cloudflare.sh; it waits for
# the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets).
# Pull requests are tested and built, but not published.
#
# Publishing needs the STROKES_DEPLOY_KEY secret: an SSH key that can push to funklunsford/strokes.
# scripts/setup-deploy-key.sh adds it. Until then, runs on main pass with a warning instead.
#
# The nightly run pushes its day files straight to main, so a push is only published if every
# commit Claude pushed since the last publish just adds day files (scripts/check-nightly.sh). If
# one did more, look, then publish by hand: Actions > Test and deploy > Run workflow.
#
# Actions are pinned to a commit (the version in the comment), so a moved tag can't change what runs.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push replaces a run still in progress on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # to find the last publish (scripts/check-nightly.sh)

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the nightly check reads every commit since the last publish
      - name: Nightly commits only add days
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/check-nightly.sh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        if: github.ref != 'refs/heads/main'
        run: npm run build
      - name: Publish to the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.STROKES_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::Not published: the STROKES_DEPLOY_KEY secret isn't set yet (run scripts/setup-deploy-key.sh)."
            npm run build
            exit 0
          fi
          bash scripts/deploy.sh
      - name: Publish to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-cloudflare.sh
